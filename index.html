<style>
  /* Codes graphiques Tesla : noir pur, blanc, gris neutres, bleu Tesla, casse normale, grands chiffres fins. */
  :root {
    --bg:#000; --panel:#1b1b1d; --panel-2:#2a2a2d; --line:#232325;
    --fg:#fff; --muted:#a2a3a5; --dim:#5e5f62;
    --blue:#3e6ae1; --cool:#3e6ae1; --heat:#e8542f; --dry:#25b39e; --fanc:#b9bbbe; --auto:#fff;
    --ok:#3bb273; --warn:#e5484d; --acc: var(--blue);
    --f: "Montserrat", "Gotham", "Century Gothic", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) { :root {
    --bg:#fff; --panel:#f4f4f4; --panel-2:#e7e7e8; --line:#ececec;
    --fg:#171a20; --muted:#5c5e62; --dim:#a2a3a5; --fanc:#5c5e62; --auto:#171a20;
    color-scheme: light;
  } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f); font-weight: 400;
    -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; overscroll-behavior: none;
    padding: env(safe-area-inset-top,0px) 0 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible, [role=button]:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .gut { padding-left: max(20px, env(safe-area-inset-left,0px)); padding-right: max(20px, env(safe-area-inset-right,0px)); }
  main { max-width: 640px; margin: 0 auto; padding-bottom: calc(48px + env(safe-area-inset-bottom,0px)); }

  /* Barre du haut */
  .top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 58px; max-width: 640px; margin: 0 auto; }
  .top > :last-child { justify-self: end; }
  .ib { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--fg); }
  .ib svg { width: 22px; height: 22px; }
  .ib:active { background: var(--panel); }
  .word { justify-self: center; font-weight: 500; font-size: .74rem; letter-spacing: .42em; text-transform: uppercase; padding-left: .42em; }
  .pill { justify-self: center; font-size: .66rem; letter-spacing: .08em; color: var(--muted); margin-top: -10px; }

  /* Accueil */
  .hstat { text-align: center; padding: 10px 0 0; }
  .hstat h1 { margin: 0; font-weight: 500; font-size: 1.55rem; letter-spacing: -.01em; }
  .hstat p { margin: 6px 0 0; color: var(--muted); font-size: .9rem; }
  .hero { text-align: center; padding: 26px 0 6px; }
  .hero .avg { font-weight: 200; font-size: clamp(84px, 26vw, 128px); line-height: 1; letter-spacing: -.05em; }
  .hero .avg sup { font-size: .3em; font-weight: 300; vertical-align: top; position: relative; top: .3em; margin-left: .04em; }
  .qa { display: flex; justify-content: space-between; gap: 6px; margin-top: 30px; }
  .qa button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 9px; font-size: .74rem; color: var(--muted); }
  .qa .c { width: 58px; height: 58px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; color: var(--fg); transition: background .25s, color .25s, transform .12s; }
  .qa .c svg { width: 24px; height: 24px; }
  .qa button:active .c { transform: scale(.94); }
  .qa button[aria-pressed="true"] { color: var(--fg); }
  .qa button[aria-pressed="true"] .c { background: var(--blue); color: #fff; }
  .segcap { margin: 18px 0 0; text-align: center; color: var(--muted); font-size: .84rem; line-height: 1.5; min-height: 1.5em; }
  .segcap .when { color: var(--dim); white-space: nowrap; }

  .sh { display: flex; justify-content: space-between; align-items: baseline; margin: 38px 0 6px; font-weight: 500; font-size: 1.02rem; }
  .sh small { font-weight: 400; font-size: .8rem; color: var(--muted); }

  /* Liste des pieces */
  .cards { display: flex; flex-direction: column; }
  .card { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .card:last-child { border-bottom: 0; }
  .card .cv.mini { width: 88px; height: 60px; flex: none; display: block; border-radius: 12px; background: var(--panel); }
  .card .cbody { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .card .nm { font-weight: 500; font-size: 1rem; }
  .card .sm { color: var(--muted); font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.on .sm { color: var(--fg); }
  .card.on .sm i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--cc); margin-right: 7px; vertical-align: 1px; }
  .card .ty { display: none; }
  .card .t { font-weight: 300; font-size: 1.6rem; letter-spacing: -.02em; flex: none; }
  .card .t small { font-size: .55em; color: var(--muted); }
  .qp { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--muted); background: var(--panel); transition: all .2s; }
  .qp svg { width: 18px; height: 18px; }
  .qp[aria-pressed="true"] { background: var(--cc); color: #fff; }

  /* Consommation */
  .cons { padding-top: 6px; }
  .cons .k { color: var(--muted); font-size: .84rem; }
  .cons .ch { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .cons .cm { font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
  .cons .eur { font-weight: 300; font-size: 2.4rem; letter-spacing: -.03em; line-height: 1; }
  .cons .pj { text-align: right; }
  .cons .pv { font-weight: 400; font-size: 1.2rem; }
  .cons .dl { display: inline-block; margin-top: 6px; font-size: .74rem; color: var(--muted); }
  .cons .dl.up { color: var(--heat); } .cons .dl.dn { color: var(--ok); }
  .cons .bars { display: flex; align-items: flex-end; gap: 3px; height: 64px; margin: 22px 0 18px; }
  .cons .bars i { flex: 1; background: var(--panel-2); border-radius: 2px; min-height: 3px; }
  .cons .bars i:nth-last-child(-n+7) { background: var(--fg); }
  .cons .bars i.part { opacity: .45; }
  .cons .splits { display: flex; flex-direction: column; gap: 10px; }
  .cons .sp { display: grid; grid-template-columns: 96px 1fr 70px; align-items: center; gap: 12px; font-size: .84rem; }
  .cons .sp span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .cons .tr { height: 3px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .cons .tr b { display: block; height: 100%; background: var(--blue); }
  .cons .v { text-align: right; white-space: nowrap; }
  .cons .v small { display: block; font-size: .7rem; color: var(--dim); }
  .cons .n { color: var(--dim); font-size: .74rem; margin: 18px 0 0; line-height: 1.55; }

  .cons .bk { margin: 10px 0 0; font-size: .8rem; color: var(--muted); }
  .cons .mix { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .cons .mix > div { background: var(--panel); border-radius: 10px; padding: 12px 14px; font-size: .8rem; color: var(--muted); display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: center; }
  .cons .mix b { grid-column: 1 / -1; color: var(--fg); font-weight: 400; font-size: 1.25rem; margin-top: 6px; }
  .cons .mix small { grid-column: 1 / -1; font-size: .74rem; }
  .cons .sw { width: 8px; height: 8px; border-radius: 2px; }
  .cons .sw.cl { background: var(--blue); } .cons .sw.ot { background: var(--fg); }
  .cons .bars.stack i, .cons .bars.stack i:nth-last-child(-n+7) { display: flex; flex-direction: column-reverse; background: var(--fg); overflow: hidden; }
  .cons .bars.stack i b { display: block; width: 100%; background: var(--blue); }
  .cons .bars.stack i:not(:nth-last-child(-n+7)) { opacity: .35; }
  .lkrow { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; padding: 14px 16px; margin-top: 18px; border-radius: 10px; background: var(--panel); }
  .lkrow span { display: flex; flex-direction: column; gap: 3px; }
  .lkrow b { font-weight: 500; font-size: .92rem; }
  .lkrow small { color: var(--muted); font-size: .78rem; line-height: 1.4; }
  .lkrow svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
  .sheet .lkrow { margin: 0 0 14px; }
  .steps { margin: 0 0 20px; padding-left: 20px; color: var(--muted); font-size: .86rem; line-height: 1.55; }
  .steps li { margin-bottom: 10px; }
  .steps .ghost { margin-top: 10px; }
  .lkok { color: var(--fg); font-size: .92rem; margin: 0 0 12px; }
  .sheet { max-height: 92vh; overflow-y: auto; }


  .offl { display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; background: color-mix(in srgb, var(--warn) 14%, var(--panel)); border-radius: 12px; padding: 14px 16px; margin: 8px 0 14px; font-size: .84rem; line-height: 1.5; }
  .offl b { font-weight: 500; color: var(--fg); }
  .offl span { color: var(--muted); }

  /* Consommation, version lisible */
  .cons .sent { margin: 14px 0 0; font-size: .92rem; line-height: 1.45; }
  .cons .bk { margin: 6px 0 0; font-size: .78rem; color: var(--muted); }
  .cht { margin-top: 26px; }
  .chh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: .86rem; font-weight: 500; flex-wrap: wrap; }
  .lg { font-weight: 400; font-size: .74rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .lg i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .lg i.lo { background: var(--muted); margin-left: 8px; } .lg i.lc { background: var(--blue); }
  .mnav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin-top: 10px; }
  .mnav span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .mnav b { font-weight: 500; font-size: .95rem; }
  .mnav small { font-size: .74rem; color: var(--muted); }
  .mnav .ib:disabled { opacity: .25; }
  .det { margin: 10px 0 8px; font-size: .8rem; color: var(--fg); min-height: 1.3em; }
  .mchart { position: relative; height: 120px; border-bottom: 1px solid var(--line); }
  .ymax { position: absolute; top: -2px; right: 0; font-size: .64rem; color: var(--dim); }
  .mchart::before { content: ""; position: absolute; left: 0; right: 0; top: 0; border-top: 1px dashed var(--line); }
  .cols { display: grid; gap: 2px; height: 100%; align-items: end; }
  .cb { height: 100%; display: flex; align-items: flex-end; padding: 0; }
  .cb i { display: flex; flex-direction: column-reverse; width: 100%; background: var(--muted); border-radius: 2px 2px 0 0; overflow: hidden; min-height: 2px; opacity: .55; transition: opacity .15s; }
  .cb i b { display: block; width: 100%; background: var(--blue); }
  .cb.sel i { opacity: 1; background: var(--fg); }
  .cb.empty { height: 3px; align-self: end; background: var(--panel-2); border-radius: 2px; }
  .cb.empty.today { background: repeating-linear-gradient(90deg, var(--muted) 0 2px, transparent 2px 4px); }
  .xl { position: relative; height: 16px; margin-top: 4px; }
  .xl em { position: absolute; transform: translateX(-50%); font-style: normal; font-size: .66rem; color: var(--dim); white-space: nowrap; }
  .xl em.l0 { left: 0; transform: none; }
  .xl em.lr { right: 0; transform: none; }
  .climb { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
  .clh { display: flex; justify-content: space-between; align-items: baseline; font-weight: 500; font-size: .95rem; }
  .clh b { font-weight: 400; font-size: 1.3rem; color: var(--blue); }
  .cls { margin: 4px 0 10px; font-size: .78rem; color: var(--muted); }
  .rr { display: grid; grid-template-columns: 1fr auto 62px; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: .86rem; }
  .rr span:nth-child(2) { color: var(--muted); }
  .rr b { font-weight: 400; text-align: right; }
  .how { margin-top: 18px; font-size: .78rem; color: var(--muted); }
  .how summary { cursor: pointer; color: var(--fg); font-weight: 500; list-style: none; }
  .how summary::-webkit-details-marker { display: none; }
  .how summary::after { content: " +"; color: var(--muted); }
  .how[open] summary::after { content: " −"; }
  .how p { line-height: 1.55; margin: 8px 0 0; }

  /* Programmation */
  .ttl { justify-self: center; font-weight: 500; font-size: 1rem; }
  .pline { margin: 6px 0 0; color: var(--muted); font-size: .8rem; }
  .prow { margin-top: 26px; }
  .progv { padding-top: 8px; }
  .pcard { display: block; width: 100%; text-align: left; background: var(--panel); border-radius: 12px; padding: 16px; margin-top: 12px; }
  .prow2 { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .prow2 > span { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .prow2 b { font-weight: 500; font-size: .95rem; }
  .prow2 small { color: var(--muted); font-size: .8rem; line-height: 1.45; }
  .prow2 > svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
  .sw { flex: none; width: 50px; height: 30px; border-radius: 999px; background: var(--panel-2); position: relative; transition: background .2s; }
  .sw i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
  .sw.on { background: var(--blue); } .sw.on i { transform: translateX(20px); }
  .leg { display: flex; gap: 16px; font-size: .76rem; color: var(--muted); margin: -2px 0 4px; }
  .leg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .tls { margin-top: 14px; display: flex; flex-direction: column; gap: 5px; }
  .tlr { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 8px; font-size: .7rem; color: var(--dim); }
  .tlr.today { color: var(--fg); font-weight: 500; }
  .tlr.big { grid-template-columns: 1fr; margin: 6px 0 12px; }
  .tlr.big .tl { height: 14px; }
  .tl { position: relative; height: 10px; border-radius: 3px; background: var(--panel-2); overflow: hidden; display: block; }
  .tl i { position: absolute; top: 0; bottom: 0; }
  .tlx { display: grid; grid-template-columns: 30px 1fr; gap: 8px; }
  .ax { display: flex; justify-content: space-between; font-size: .62rem; color: var(--dim); }
  .ax em { font-style: normal; }
  .note2 { color: var(--dim); font-size: .76rem; line-height: 1.55; margin: 16px 0 0; }
  .elog { list-style: none; padding: 0; margin: 0; font-size: .8rem; color: var(--muted); }
  .elog li { padding: 10px 0; border-bottom: 1px solid var(--line); line-height: 1.4; }
  .elog time { display: block; font-size: .7rem; color: var(--dim); margin-bottom: 2px; }
  .opts2 .lkrow { margin: 0 0 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .pick.days { flex-wrap: nowrap; gap: 4px; }
  .pick.days button { flex: 1; padding: 10px 0; text-align: center; }
  .step2 { display: grid; grid-template-columns: 92px 1fr 32px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .tsel { display: flex; align-items: center; gap: 2px; background: var(--panel); border-radius: 4px; height: 40px; padding: 0 6px; }
  .tsel select { font: inherit; font-size: .95rem; color: var(--fg); background: transparent; border: 0; -webkit-appearance: none; appearance: none; padding: 0 2px; text-align: center; }
  .tsel select:disabled { opacity: .5; }
  .tsel b { font-weight: 400; color: var(--muted); }
  .fld.half .tsel { background: var(--panel); }
  .step2 input { font: inherit; font-size: .95rem; color: var(--fg); background: var(--panel); border: 0; border-radius: 4px; height: 40px; padding: 0 8px; width: 100%; }
  .step2 input:disabled { opacity: .5; }
  .seg3 { display: flex; background: var(--panel); border-radius: 4px; padding: 2px; }
  .seg3 button { flex: 1; font-size: .76rem; padding: 9px 0; border-radius: 3px; color: var(--muted); }
  .seg3 button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 500; }
  .rmv { width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted); }
  .rmv svg { width: 16px; height: 16px; }
  #pd { margin-bottom: 4px; }

  /* Ecran piece */
  .rsw { justify-self: center; display: flex; background: var(--panel); border-radius: 999px; padding: 3px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .rsw::-webkit-scrollbar { display: none; }
  .rp { flex: none; display: flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; color: var(--muted); font-size: .82rem; transition: background .2s, color .2s; }
  .rp i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
  .rp.on i { background: var(--pc); }
  .rp[aria-current="true"] { background: var(--panel-2); color: var(--fg); font-weight: 500; }
  .room { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .status { margin: 10px 0 0; color: var(--muted); font-size: .9rem; }
  .status b { color: var(--fg); font-weight: 500; }
  .stage { position: relative; width: calc(100% + 40px); margin: 4px -20px 0; }
  .stage .cv.big { display: block; width: 100%; height: 300px; cursor: grab; -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent); mask-image: linear-gradient(to bottom, #000 72%, transparent); }
  .vp { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: .8rem; color: var(--muted); pointer-events: none; transition: color .2s; }
  .vp.live { color: var(--fg); }
  .ghint { position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); font-size: .78rem; color: var(--fg); background: var(--panel); padding: 9px 16px; border-radius: 999px; white-space: nowrap; pointer-events: none; animation: hintin 1s .6s both; }
  @keyframes hintin { from { opacity: 0; transform: translate(-50%, 6px); } }

  .dial { display: flex; align-items: center; justify-content: center; gap: clamp(18px, 7vw, 46px); margin: 6px 0 10px; width: 100%; }
  .chev { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--fg); transition: transform .12s, background .2s; flex: none; }
  .chev:active { transform: scale(.9); background: var(--panel); }
  .chev svg { width: 30px; height: 30px; }
  .setpoint { display: flex; align-items: flex-start; font-weight: 200; line-height: .9; min-width: 3.4ch; justify-content: center; transition: opacity .2s; }
  .setpoint .num { font-size: clamp(96px, 30vw, 140px); letter-spacing: -.05em; }
  .setpoint .side { display: flex; flex-direction: column; align-items: flex-start; margin-left: 4px; padding-top: .35em; }
  .setpoint .deg { font-size: clamp(28px, 7vw, 40px); font-weight: 300; }
  .setpoint .dec { font-size: clamp(24px, 6vw, 34px); font-weight: 300; color: var(--muted); }
  .room.off .setpoint { opacity: .35; }
  .chip { font-size: .8rem; color: var(--fg); background: var(--panel); padding: 9px 16px; border-radius: 999px; margin: 2px 0 18px; }

  .pwr { width: 68px; height: 68px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; color: var(--muted); transition: all .25s; }
  .pwr svg { width: 28px; height: 28px; }
  .pwr[aria-pressed="true"] { background: var(--acc); color: #fff; }
  .pwrlbl { margin-top: 10px; font-size: .8rem; color: var(--muted); }

  .lbl { width: 100%; text-align: left; margin: 34px 0 14px; font-size: .98rem; font-weight: 500; color: var(--fg); }
  .modes { display: flex; justify-content: space-between; width: 100%; }
  .mode { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 9px; color: var(--muted); font-size: .74rem; }
  .mode .c { width: 56px; height: 56px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; color: var(--fg); transition: background .2s, color .2s, transform .12s; }
  .mode .c svg { width: 24px; height: 24px; }
  .mode:active .c { transform: scale(.94); }
  .mode[aria-pressed="true"] { color: var(--fg); }
  .mode[aria-pressed="true"] .c { background: var(--m); color: #fff; }
  .mode[data-m="Cool"]{--m:var(--cool)} .mode[data-m="Heat"]{--m:var(--heat)} .mode[data-m="Dry"]{--m:var(--dry)} .mode[data-m="Fan"]{--m:#6b6d70}
